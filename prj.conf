# ============================================
# Logging Configuration
# ============================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ============================================
# Console Configuration
# ============================================
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# ============================================
# Random Number Generation
# ============================================
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# ============================================
# Memory Configuration
# ============================================
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ============================================
# ZBus Configuration
# ============================================
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# ============================================
# Runtime Checks
# ============================================
CONFIG_ASSERT=y

# ============================================
# Display Configuration
# ============================================
CONFIG_DISPLAY_ANSI_COLORS=y

# ============================================
# Radar Configuration
# ============================================
CONFIG_RADAR_SENSOR_DISTANCE_MM=3000
CONFIG_RADAR_SPEED_LIMIT_LIGHT_KMH=60
CONFIG_RADAR_SPEED_LIMIT_HEAVY_KMH=40
CONFIG_RADAR_WARNING_THRESHOLD_PERCENT=90
CONFIG_RADAR_CAMERA_FAILURE_RATE_PERCENT=10

# ============================================
# Simulation Configuration
# ============================================
CONFIG_RADAR_SPEED_MIN_KMH=30
CONFIG_RADAR_SPEED_MAX_KMH=120
CONFIG_RADAR_DETECTION_INTERVAL_S=5